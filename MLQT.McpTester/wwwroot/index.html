<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MLQT.McpTester</title>
    <base href="/" />

    <!--
        MLQT's theme, in the order MLQT.UI.Theme/ThemeAssetManifest.cs gives, with this tool's own
        app.css between its leading and trailing stylesheets. HostAssetManifestTests holds this page
        to that order: mlqt-density.css only wins if it follows MudBlazor's sheet. Roboto is the
        theme's bundled copy, so nothing is downloaded and the tool looks the same with no network
        (B124).
    -->
    <link rel="stylesheet" href="_content/MLQT.UI.Theme/mlqt-base.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="_content/MLQT.UI.Theme/fonts/roboto.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/MLQT.UI.Theme/mlqt-density.css" />
    <link rel="stylesheet" href="MLQT.McpTester.styles.css" />
    <link rel="icon" href="data:," />
</head>

<body>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- No autostart="false": that attribute is a MAUI contract - its BlazorWebView is what calls
         Blazor.start(). Under Photino nothing does, so the window opens, the host starts and no
         component is ever created, with no error anywhere. Found by 7b-0's Windows leg. -->
    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/MLQT.UI.Theme/mudBlazorWorkarounds.js"></script>

</body>

</html>
