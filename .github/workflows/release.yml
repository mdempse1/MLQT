name: Release

on:
  push:
    tags:
      # Both spellings, because this repository uses the second one. Every release so far has been
      # tagged bare (2026.1.0 ... 2026.3.1), which the 'v*' pattern does not match - so the tag
      # trigger had never once fired, and each release was cut by dispatching this workflow by hand
      # and attaching its artifacts to a release created separately. 'v*' is kept so an existing
      # habit does not silently stop working.
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The version, worked out once. Both build jobs derived it separately while the Windows half was
  # still the pre-installer one, which was marked as temporary rather than tidied; now that both
  # halves build an installer they take it from here, so a tag can only mean one thing.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      deb: ${{ steps.v.outputs.deb }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v='${{ github.event.inputs.version }}'
          else
            v='${{ github.ref_name }}'
            v="${v#v}"
          fi
          echo "version=$v" >> $GITHUB_OUTPUT
          # A semver pre-release becomes a Debian one: 1.2.3-rc1 -> 1.2.3~rc1, which sorts *before*
          # 1.2.3 exactly as the semver does. package-deb.sh names its output by the same rule.
          echo "deb=$(echo "$v" | sed 's/+.*//; s/-/~/')" >> $GITHUB_OUTPUT

  build-and-release:
    name: Build & Publish the Windows installer
    runs-on: windows-latest
    needs: version

    # Creating the release and uploading its assets is a write, and this repository's default workflow
    # token is read-only, so the step failed with a 403 the first time it ever ran - which was the
    # first tag-triggered release, because the trigger itself had never fired before. Declared here
    # rather than by making the repository-wide default read/write: only this job writes anything,
    # and a setting in the web UI is not visible to anyone reading this file.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore MLQT.slnx

      - name: Run tests
        run: |
          dotnet test ModelicaParser.Tests -c Release --no-restore
          dotnet test ModelicaGraph.Tests -c Release --no-restore
          dotnet test RevisionControl.Tests -c Release --no-restore --filter "FullyQualifiedName!~Svn"
          dotnet test MLQT.Services.Tests -c Release --no-restore
          dotnet test MLQT.McpServer.Tests -c Release --no-restore
          dotnet test MLQT.Cli.Tests -c Release --no-restore
          dotnet test MLQT.Shared.Tests -c Release --no-restore

      # Stage the SlikSVN command-line client so the publish copies it into the tree under svn/. The
      # zip URL is a repository variable (Settings > Secrets and variables > Actions > Variables):
      # SLIKSVN_ZIP_URL must point at a SlikSVN >= 1.14 x64 .zip.
      #
      # There is no separate "verify it arrived" step any more: publish-tools.ps1 fails on a missing
      # client unless -AllowMissingSvn is passed, and this job does not pass it. One mechanism, and
      # the one that also runs on a developer's machine.
      - name: Bundle SlikSVN command-line client
        shell: pwsh
        run: pwsh build/fetch-svn-tools.ps1 -ZipUrl "${{ vars.SLIKSVN_ZIP_URL }}"

      # Inno Setup ships on the windows runner image, but "ships on the image" is a fact about today's
      # image. Finding it here means a change to that becomes one sentence rather than a compiler that
      # is not on PATH and an error nobody can read.
      - name: Locate the Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup 6 is not on this runner. Install it (choco install innosetup) or pin an image that has it."
          }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using $iscc"

      # Framework-dependent on Windows: the installer downloads .NET 10 and WebView2 when they are
      # absent, which keeps the download around 16 MB rather than 90 MB.
      #
      # The smoke tests run - the CLI answers, the MCP server completes a handshake, and the GUI's 16
      # /selftest probes run against the published tree. That last needs WebView2, which the runner
      # image has, and it is the same check the desktop-selftest job makes on every push.
      - name: Publish the three tools into one tree
        shell: pwsh
        run: >
          pwsh build/publish-tools.ps1
          -Runtime win-x64
          -Version ${{ needs.version.outputs.version }}
          -Output publish/win-x64

      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "${{ steps.iscc.outputs.path }}" /Qp `
            "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DStageDir=$PWD\publish\win-x64" `
            "/DOutputDir=$PWD\artifacts" `
            build/installer/mlqt.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

      # The same question the Linux job asks of its .deb: not "does the installer contain the right
      # files" but "does what it installed run". Installed per-user and silently, exercised, removed.
      - name: Install it, and run what it installed
        shell: pwsh
        run: |
          $setup = "artifacts/MLQT-${{ needs.version.outputs.version }}-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "no installer at $setup" }

          $dir = Join-Path $env:RUNNER_TEMP 'mlqt-installed'
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES',"/DIR=$dir",'/TASKS=addtopath' -Wait

          foreach ($f in 'MLQT.Photino.exe','mlqt.exe','MLQT.McpServer.exe','mlqt.ico','wwwroot\index.html','svn\svn.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "the installed tree has no $f" }
          }

          & (Join-Path $dir 'mlqt.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "the installed mlqt exited $LASTEXITCODE" }

          # The installed GUI, from where a user would run it.
          $report = Join-Path $env:RUNNER_TEMP 'installed-selftest.json'
          $env:MLQT_SELFTEST = '1'
          $env:MLQT_SELFTEST_HOST = 'MLQT.Photino'
          $env:MLQT_SELFTEST_OUT = $report
          Start-Process (Join-Path $dir 'MLQT.Photino.exe') -Wait -NoNewWindow
          Remove-Item Env:MLQT_SELFTEST, Env:MLQT_SELFTEST_HOST, Env:MLQT_SELFTEST_OUT

          if (-not (Test-Path $report)) { throw 'the installed GUI wrote no self-test report' }
          $probes = (Get-Content $report -Raw | ConvertFrom-Json).Probes
          $bad = @($probes | Where-Object { $_.Status -ne 'Pass' })
          $bad | ForEach-Object { Write-Host "::error::$($_.Id): $($_.Detail)" }
          Write-Host "$($probes.Count - $bad.Count)/$($probes.Count) probes passed from the installed package"
          if ($bad.Count) { throw 'the installed GUI failed its self-test' }

          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $dir) { throw 'uninstalling left the install directory behind' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MLQT-${{ needs.version.outputs.version }}-win-x64-setup
          path: artifacts/MLQT-${{ needs.version.outputs.version }}-win-x64-setup.exe

      # Any tag, not only 'v'-prefixed ones - see the trigger above for why that mattered.
      #
      # The installer is **unsigned**, so Windows SmartScreen warns on first run. Deliberate for now:
      # a certificate is a decision that has not been taken, and an unsigned zip would have been
      # flagged identically - so it is not a cost of having an installer.
      # Documentation/installation.md tells users what they will see.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/MLQT-${{ needs.version.outputs.version }}-win-x64-setup.exe
          generate_release_notes: true
          draft: true

  # ---------------------------------------------------------------------------------------------
  # The Linux installer (phase 7b-7).
  #
  # A second job rather than more steps in the first, because dpkg-deb does not exist on a Windows
  # runner. Both jobs feed the same release: the one above attaches the Windows artefacts, this one
  # attaches the .deb, and `softprops/action-gh-release` adds files to the existing draft rather
  # than replacing it.
  #
  # Both halves now build an installer and nothing else. What a tag produces is exactly two files:
  # the Inno setup and this .deb. The nupkg, the linux tarball and the two Windows zips are gone -
  # `dotnet tool install` is an SDK command, and obliging a build agent to install the SDK to run a
  # linter was the wrong trade, so the CLI ships inside both installers instead.
  # ---------------------------------------------------------------------------------------------
  linux-deb:
    name: Build & Publish .deb
    runs-on: ubuntu-latest
    needs: version

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # What the *smoke tests* need, not what the build needs. The GUI's 16 /selftest probes are the
      # strongest check this repository has and they run a real WebKitGTK window, so the runner needs
      # webkit and a virtual display. libnotify4 is the one nothing else pulls in - libwebkit2gtk-4.1-0
      # does not depend on it and Photino.Native links it - which is exactly why the .deb declares it.
      - name: Install WebKitGTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libnotify4 xvfb

      # Self-contained: neither Ubuntu nor Debian carries .NET 10, so a dependency on it would mean
      # asking every user to add Microsoft's apt feed before `apt install` would work at all. The
      # ~80 MB is the price of the package installing with one command.
      #
      # -AllowMissingSvn because there is no bundled svn client on Linux by design: the .deb
      # recommends `subversion` and SvnToolLocator finds it on PATH.
      - name: Publish the three tools into one tree
        shell: pwsh
        run: >
          pwsh build/publish-tools.ps1
          -Runtime linux-x64
          -SelfContained
          -AllowMissingSvn
          -Version ${{ needs.version.outputs.version }}
          -Output publish/linux-x64
          -SkipSmokeTests

      # Under xvfb-run, so the packaged GUI's self-test probes actually run. The script skips them
      # when there is no display, and a skipped check on the release path is the one that matters.
      - name: Build the .deb, and prove the packaged tools run
        run: >
          xvfb-run -a bash build/package-deb.sh
          --version ${{ needs.version.outputs.version }}
          --stage publish/linux-x64
          --output artifacts

      # apt's own opinion of the package, which is a different question from "does it contain the
      # right files": a malformed field or an unsatisfiable dependency only shows up here.
      - name: Install it, and run what it installed
        run: |
          sudo apt-get install -y ./artifacts/mlqt_${{ needs.version.outputs.deb }}_amd64.deb
          mlqt --version
          test -x /usr/bin/mlqt-gui
          test -f /usr/share/applications/MLQT.Photino.desktop
          desktop-file-validate /usr/share/applications/MLQT.Photino.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/mlqt.png
          # The installed GUI, launched the way a user would from a terminal - which is the wrapper
          # that overrides argv[0] so the window keeps the app_id the desktop entry is named after.
          # A timeout because a host that never renders would otherwise hold the job for six hours.
          MLQT_SELFTEST=1 MLQT_SELFTEST_HOST=MLQT.Photino \
            MLQT_SELFTEST_OUT="$PWD/installed-selftest.json" \
            timeout 300 xvfb-run -a mlqt-gui
          python3 -c "
          import json,sys
          probes = json.load(open('installed-selftest.json'))['Probes']
          bad = [p for p in probes if p['Status'] != 'Pass']
          for p in bad: print('::error::' + p['Id'] + ': ' + str(p.get('Detail')))
          print(f'{len(probes)-len(bad)}/{len(probes)} probes passed from the installed package')
          sys.exit(1 if bad else 0)"
          sudo apt-get remove -y mlqt
          test ! -e /opt/mlqt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MLQT-${{ needs.version.outputs.version }}-linux-x64-deb
          path: artifacts/mlqt_${{ needs.version.outputs.deb }}_amd64.deb

      - name: Add the .deb to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/mlqt_${{ needs.version.outputs.deb }}_amd64.deb
          generate_release_notes: true
          draft: true
