name: Release

on:
  push:
    tags:
      # Both spellings, because this repository uses the second one. Every release so far has been
      # tagged bare (2026.1.0 ... 2026.3.1), which the 'v*' pattern does not match - so the tag
      # trigger had never once fired, and each release was cut by dispatching this workflow by hand
      # and attaching its artifacts to a release created separately. 'v*' is kept so an existing
      # habit does not silently stop working.
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    # Creating the release and uploading its assets is a write, and this repository's default workflow
    # token is read-only, so the step failed with a 403 the first time it ever ran - which was the
    # first tag-triggered release, because the trigger itself had never fired before. Declared here
    # rather than by making the repository-wide default read/write: only this job writes anything,
    # and a setting in the web UI is not visible to anyone reading this file.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Strip 'v' prefix from tag
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Restore dependencies
        run: |
          dotnet restore MLQT.slnx
          dotnet restore MLQT/MLQT.csproj -r win-x64
          dotnet restore MLQT.McpServer/MLQT.McpServer.csproj -r win-x64

      - name: Run tests
        run: |
          dotnet test ModelicaParser.Tests -c Release --no-restore
          dotnet test ModelicaGraph.Tests -c Release --no-restore
          dotnet test RevisionControl.Tests -c Release --no-restore --filter "FullyQualifiedName!~Svn"
          dotnet test MLQT.Services.Tests -c Release --no-restore
          dotnet test MLQT.McpServer.Tests -c Release --no-restore
          # The CLI is a shipped artifact of this workflow, so it is tested by it. It was absent
          # while it was only built here; now that the release packs and publishes the tool, a
          # release could otherwise ship an `mlqt` that no step in this workflow ever ran.
          dotnet test MLQT.Cli.Tests -c Release --no-restore
          # Added for the same reason, one release later: MLQT.Shared holds the entire desktop UI and
          # this workflow publishes it. Its suite arrived in phase 7a and was not added here, so a
          # release could ship the UI with none of its 327 tests having run in this workflow.
          dotnet test MLQT.Shared.Tests -c Release --no-restore

      # Stage the SlikSVN command-line client into MLQT/svn-tools/win-x64 so the publish
      # step (via MLQT.csproj) copies it into the app output under svn/. The zip URL is
      # configured as a repository variable (Settings > Secrets and variables > Actions >
      # Variables): SLIKSVN_ZIP_URL must point at a SlikSVN >= 1.14 x64 .zip.
      - name: Bundle SlikSVN command-line client
        shell: pwsh
        run: pwsh build/fetch-svn-tools.ps1 -ZipUrl "${{ vars.SLIKSVN_ZIP_URL }}"

      - name: Publish MLQT (self-contained)
        run: >
          dotnet publish MLQT/MLQT.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -o publish/MLQT

      # Fail the release loudly if the svn client did not make it into the output, rather
      # than silently shipping a zip that falls back to PATH/SharpSvn on the user's machine.
      - name: Verify bundled svn client
        shell: pwsh
        run: |
          $svn = "publish/MLQT/svn/svn.exe"
          if (-not (Test-Path $svn)) {
            throw "Bundled svn.exe missing from publish output ($svn). Check the 'Bundle SlikSVN' step and the SLIKSVN_ZIP_URL variable."
          }
          & $svn --version --quiet
          Write-Host "Bundled svn client OK."

      # The MCP server is a separate, headless console executable (not part of the MAUI app).
      # Publish it self-contained so it runs without a preinstalled .NET runtime, and ship it as
      # its own release asset so the main app download stays lean.
      - name: Publish MLQT.McpServer (self-contained)
        run: >
          dotnet publish MLQT.McpServer/MLQT.McpServer.csproj
          -c Release
          -f net10.0
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/MLQT.McpServer

      # The CLI is a `dotnet tool` (PackageId MLQT.Cli, command `mlqt`), which is how
      # Documentation/cli.md tells people to install it - so a release that did not carry the package
      # left those instructions with nothing to install from. Packed at the release's version rather
      # than the 0.1.0 in the csproj, so the tool and the app a user downloads say the same thing.
      #
      # This package is framework-dependent and carries no runtime identifier, so it is already the
      # Linux and macOS build as well as the Windows one: MLQT.Cli targets plain net10.0 and nothing
      # in its dependency chain is Windows-only. The linux-x64 archive below is not a second package
      # for a platform this one misses - it is for machines with no .NET 10 runtime to install into.
      - name: Pack the mlqt CLI tool
        run: >
          dotnet pack MLQT.Cli/MLQT.Cli.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/nupkg

      # Same reasoning as the bundled svn client: fail here rather than publish a release whose
      # documented install command has no package behind it.
      - name: Verify the CLI package
        shell: pwsh
        run: |
          $nupkg = "publish/nupkg/MLQT.Cli.${{ steps.version.outputs.version }}.nupkg"
          if (-not (Test-Path $nupkg)) {
            throw "Expected $nupkg. Check the pack step and MLQT.Cli's PackageId/Version."
          }
          Write-Host "CLI package OK: $nupkg"

      # A self-contained linux-x64 `mlqt` for machines with no .NET 10 runtime - a CI agent or a
      # container where installing one is not wanted. Cross-published from this Windows runner, which
      # needs no Linux toolchain: the output is managed code plus the runtime's own native libraries.
      - name: Publish the mlqt CLI (self-contained linux-x64)
        run: >
          dotnet publish MLQT.Cli/MLQT.Cli.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/mlqt-linux-x64

      # tar, not zip: it preserves the executable bit on `mlqt`, which a zip does not, so the file a
      # user extracts is one they can run without being told to chmod it first.
      - name: Archive the Linux CLI
        shell: bash
        run: |
          test -f publish/mlqt-linux-x64/mlqt || { echo "no mlqt binary in the linux-x64 publish"; exit 1; }
          chmod +x publish/mlqt-linux-x64/mlqt
          tar -czf "mlqt-${{ steps.version.outputs.version }}-linux-x64.tar.gz" -C publish/mlqt-linux-x64 .

      - name: Create zip archives
        shell: pwsh
        run: |
          Compress-Archive -Path publish/MLQT/* -DestinationPath "MLQT-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/MLQT.McpServer/* -DestinationPath "MLQT.McpServer-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MLQT-${{ steps.version.outputs.version }}-win-x64
          path: |
            MLQT-${{ steps.version.outputs.version }}-win-x64.zip
            MLQT.McpServer-${{ steps.version.outputs.version }}-win-x64.zip
            publish/nupkg/MLQT.Cli.${{ steps.version.outputs.version }}.nupkg
            mlqt-${{ steps.version.outputs.version }}-linux-x64.tar.gz

      # Any tag, not only 'v'-prefixed ones - see the trigger above for why that mattered.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MLQT-${{ steps.version.outputs.version }}-win-x64.zip
            MLQT.McpServer-${{ steps.version.outputs.version }}-win-x64.zip
            publish/nupkg/MLQT.Cli.${{ steps.version.outputs.version }}.nupkg
            mlqt-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          generate_release_notes: true
          draft: true

  # ---------------------------------------------------------------------------------------------
  # The Linux installer (phase 7b-7).
  #
  # A second job rather than more steps in the first, because dpkg-deb does not exist on a Windows
  # runner. Both jobs feed the same release: the one above attaches the Windows artefacts, this one
  # attaches the .deb, and `softprops/action-gh-release` adds files to the existing draft rather
  # than replacing it.
  #
  # **The Windows job is still the pre-installer one.** It publishes the MAUI app and the zips, and
  # 7b-7's other half turns it into the job that builds build/installer/mlqt.iss. When that happens
  # the two jobs should take their version from one place instead of each deriving it - the
  # duplication below is temporary and marked rather than tidy.
  # ---------------------------------------------------------------------------------------------
  linux-deb:
    name: Build & Publish .deb
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      # A semver pre-release becomes a Debian one: 1.2.3-rc1 -> 1.2.3~rc1, which sorts *before*
      # 1.2.3 exactly as the semver does. package-deb.sh applies the same rule to name its output,
      # so this is the file name that will exist.
      - name: The Debian version
        id: deb
        run: echo "version=$(echo '${{ steps.version.outputs.version }}' | sed 's/+.*//; s/-/~/')" >> $GITHUB_OUTPUT

      # What the *smoke tests* need, not what the build needs. The GUI's 16 /selftest probes are the
      # strongest check this repository has and they run a real WebKitGTK window, so the runner needs
      # webkit and a virtual display. libnotify4 is the one nothing else pulls in - libwebkit2gtk-4.1-0
      # does not depend on it and Photino.Native links it - which is exactly why the .deb declares it.
      - name: Install WebKitGTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libnotify4 xvfb

      # Self-contained: neither Ubuntu nor Debian carries .NET 10, so a dependency on it would mean
      # asking every user to add Microsoft's apt feed before `apt install` would work at all. The
      # ~80 MB is the price of the package installing with one command.
      #
      # -AllowMissingSvn because there is no bundled svn client on Linux by design: the .deb
      # recommends `subversion` and SvnToolLocator finds it on PATH.
      - name: Publish the three tools into one tree
        shell: pwsh
        run: >
          pwsh build/publish-tools.ps1
          -Runtime linux-x64
          -SelfContained
          -AllowMissingSvn
          -Version ${{ steps.version.outputs.version }}
          -Output publish/linux-x64
          -SkipSmokeTests

      # Under xvfb-run, so the packaged GUI's self-test probes actually run. The script skips them
      # when there is no display, and a skipped check on the release path is the one that matters.
      - name: Build the .deb, and prove the packaged tools run
        run: >
          xvfb-run -a bash build/package-deb.sh
          --version ${{ steps.version.outputs.version }}
          --stage publish/linux-x64
          --output artifacts

      # apt's own opinion of the package, which is a different question from "does it contain the
      # right files": a malformed field or an unsatisfiable dependency only shows up here.
      - name: Install it, and run what it installed
        run: |
          sudo apt-get install -y ./artifacts/mlqt_${{ steps.deb.outputs.version }}_amd64.deb
          mlqt --version
          test -x /usr/bin/mlqt-gui
          test -f /usr/share/applications/MLQT.Photino.desktop
          desktop-file-validate /usr/share/applications/MLQT.Photino.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/mlqt.png
          # The installed GUI, launched the way a user would from a terminal - which is the wrapper
          # that overrides argv[0] so the window keeps the app_id the desktop entry is named after.
          # A timeout because a host that never renders would otherwise hold the job for six hours.
          MLQT_SELFTEST=1 MLQT_SELFTEST_HOST=MLQT.Photino \
            MLQT_SELFTEST_OUT="$PWD/installed-selftest.json" \
            timeout 300 xvfb-run -a mlqt-gui
          python3 -c "
          import json,sys
          probes = json.load(open('installed-selftest.json'))['Probes']
          bad = [p for p in probes if p['Status'] != 'Pass']
          for p in bad: print('::error::' + p['Id'] + ': ' + str(p.get('Detail')))
          print(f'{len(probes)-len(bad)}/{len(probes)} probes passed from the installed package')
          sys.exit(1 if bad else 0)"
          sudo apt-get remove -y mlqt
          test ! -e /opt/mlqt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: MLQT-${{ steps.version.outputs.version }}-linux-x64-deb
          path: artifacts/mlqt_${{ steps.deb.outputs.version }}_amd64.deb

      - name: Add the .deb to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/mlqt_${{ steps.deb.outputs.version }}_amd64.deb
          generate_release_notes: true
          draft: true
