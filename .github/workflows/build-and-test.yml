name: Build and Test

on:
  # Every branch, not just main/develop. A long-lived working branch used to build nowhere until the
  # pull request that merged it, so 205 commits of the CI/CD work reached their first CI run at the
  # moment they were being merged - which is the worst time to learn the build is broken.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-libraries:
    name: Build & Test Libraries
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore dependencies
        run: dotnet restore MLQT.slnx

      - name: Build library projects
        run: |
          dotnet build ModelicaParser/ModelicaParser.csproj -c Release --no-restore
          dotnet build ModelicaGraph/ModelicaGraph.csproj -c Release --no-restore
          dotnet build RevisionControl/RevisionControl.csproj -c Release --no-restore
          dotnet build MLQT.Services/MLQT.Services.csproj -c Release --no-restore
          dotnet build DymolaInterface/DymolaInterface.csproj -c Release --no-restore
          dotnet build OpenModelicaInterface/OpenModelicaInterface.csproj -c Release --no-restore
          dotnet build MLQT.McpServer/MLQT.McpServer.csproj -c Release --no-restore
          dotnet build MLQT.Cli/MLQT.Cli.csproj -c Release --no-restore
          dotnet build MLQT.Shared/MLQT.Shared.csproj -c Release --no-restore

      - name: Build test projects
        run: |
          dotnet build ModelicaParser.Tests/ModelicaParser.Tests.csproj -c Release --no-restore
          dotnet build ModelicaGraph.Tests/ModelicaGraph.Tests.csproj -c Release --no-restore
          dotnet build RevisionControl.Tests/RevisionControl.Tests.csproj -c Release --no-restore
          dotnet build MLQT.Services.Tests/MLQT.Services.Tests.csproj -c Release --no-restore
          dotnet build MLQT.McpServer.Tests/MLQT.McpServer.Tests.csproj -c Release --no-restore
          dotnet build MLQT.Cli.Tests/MLQT.Cli.Tests.csproj -c Release --no-restore
          dotnet build MLQT.Shared.Tests/MLQT.Shared.Tests.csproj -c Release --no-restore
          # The MCP tester stopped being a MAUI app in 7b-1 and is a plain net10.0 Photino one, so
          # it builds here rather than in the MAUI job - and on Linux too, which it could not before.
          dotnet build MLQT.McpTester/MLQT.McpTester.csproj -c Release --no-restore
          # Built but not run, for the same reason as the SVN integration tests below: these drive a
          # live Dymola / OpenModelica install that no runner has, and they assert on what it answers
          # rather than self-skipping. Building them still catches the thing CI can catch - a change
          # to the interfaces that stops them compiling, which would otherwise reach main unnoticed.
          dotnet build DymolaInterface.Tests/DymolaInterface.Tests.csproj -c Release --no-restore
          dotnet build OpenModelicaInterface.Tests/OpenModelicaInterface.Tests.csproj -c Release --no-restore

      # Each suite runs even if an earlier one failed, and the job still fails. Stopping at the first
      # failure means one round trip per broken suite, which is the wrong trade when six of these had
      # never run on Linux at all - the first run should say everything that is wrong, not the first
      # thing. Same reasoning as fail-fast: false on the journeys matrix.
      - name: Run ModelicaParser tests
        if: '!cancelled()'
        run: dotnet test ModelicaParser.Tests -c Release --no-build --report-trx --report-trx-filename parser.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run ModelicaGraph tests
        if: '!cancelled()'
        run: dotnet test ModelicaGraph.Tests -c Release --no-build --report-trx --report-trx-filename graph.trx --results-directory ${{ github.workspace }}/TestResults

      # SVN tests are excluded on CI: the integration tests need a live working copy /
      # server (e.g. C:\Projects\ModelicaEditorTest) that doesn't exist on the runner, and
      # they self-skip when it's absent. Bundling the SlikSVN client (see
      # build/fetch-svn-tools.ps1) does NOT make these runnable on its own — it only
      # supplies svn.exe, not a repository. The bundled client is validated instead by the
      # release workflow's "Verify bundled svn client" step. To run SVN tests locally,
      # check out a working copy at that path and run RevisionControl.Tests without the filter.
      - name: Run RevisionControl tests (exclude SVN integration)
        if: '!cancelled()'
        run: dotnet test RevisionControl.Tests -c Release --no-build --filter "FullyQualifiedName!~Svn" --report-trx --report-trx-filename revcontrol.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.Services tests
        if: '!cancelled()'
        run: dotnet test MLQT.Services.Tests -c Release --no-build --report-trx --report-trx-filename services.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.McpServer tests
        if: '!cancelled()'
        run: dotnet test MLQT.McpServer.Tests -c Release --no-build --report-trx --report-trx-filename mcpserver.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.Cli tests
        if: '!cancelled()'
        run: dotnet test MLQT.Cli.Tests -c Release --no-build --report-trx --report-trx-filename cli.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.Shared tests
        if: '!cancelled()'
        run: dotnet test MLQT.Shared.Tests -c Release --no-build --report-trx --report-trx-filename shared.trx --results-directory ${{ github.workspace }}/TestResults

      # The CLI tests assert the shape we expect of a SARIF document, which cannot catch one that is
      # well-formed by our lights and rejected by a consumer's. This validates a report generated from
      # a committed fixture against the SARIF 2.1.0 schema, and — because the fixture sits at a nested
      # path — proves in the same step that --sarif-base writes paths a consumer can resolve.
      - name: Validate SARIF output
        run: pwsh -File build/validate-sarif.ps1

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx

  linux-tests:
    # The Windows suites, run again on Linux. Everything in build-libraries runs on windows-latest and
    # nothing but the journeys ran anywhere else, which is an odd place to be for a phase whose whole
    # deliverable is a Linux UI - and the code most likely to differ is exactly what was untested
    # there: RevisionControl spawns git and svn processes, MLQT.Services does the encoding and path
    # work ModelicaFileEncoding exists for, and ModelicaParser carries a 95% bar because it is
    # critical. The precedent is on the record: the first Linux job this repository ever had found six
    # MLQT.Cli tests built around a literal Windows drive path within a day of being added.
    #
    # Project by project rather than the solution: MLQT.slnx contains the MAUI app, whose workload
    # does not exist on Linux. Deliberately does NOT install the MAUI workload - if this job ever
    # needs it, something non-portable has reached a project that is supposed to be portable, and
    # that is the finding rather than a reason to install it.
    name: Build & Test Libraries (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build the test projects and everything beneath them
        run: |
          dotnet build ModelicaParser.Tests/ModelicaParser.Tests.csproj -c Release
          dotnet build ModelicaGraph.Tests/ModelicaGraph.Tests.csproj -c Release
          dotnet build RevisionControl.Tests/RevisionControl.Tests.csproj -c Release
          dotnet build MLQT.Services.Tests/MLQT.Services.Tests.csproj -c Release
          dotnet build MLQT.McpServer.Tests/MLQT.McpServer.Tests.csproj -c Release
          dotnet build MLQT.Cli.Tests/MLQT.Cli.Tests.csproj -c Release
          dotnet build MLQT.Shared.Tests/MLQT.Shared.Tests.csproj -c Release
          dotnet build MLQT.McpTester/MLQT.McpTester.csproj -c Release

      # Each suite runs even if an earlier one failed, and the job still fails. Stopping at the first
      # failure means one round trip per broken suite, which is the wrong trade when six of these had
      # never run on Linux at all - the first run should say everything that is wrong, not the first
      # thing. Same reasoning as fail-fast: false on the journeys matrix.
      - name: Run ModelicaParser tests
        if: '!cancelled()'
        run: dotnet test ModelicaParser.Tests -c Release --no-build --report-trx --report-trx-filename parser-linux.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run ModelicaGraph tests
        if: '!cancelled()'
        run: dotnet test ModelicaGraph.Tests -c Release --no-build --report-trx --report-trx-filename graph-linux.trx --results-directory ${{ github.workspace }}/TestResults

      # Same exclusion as the Windows job: the SVN integration tests need a working copy and a server
      # no runner has. Kept identical so the two platforms measure the same thing.
      - name: Run RevisionControl tests (exclude SVN integration)
        if: '!cancelled()'
        run: dotnet test RevisionControl.Tests -c Release --no-build --filter "FullyQualifiedName!~Svn" --report-trx --report-trx-filename revcontrol-linux.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.Services tests
        if: '!cancelled()'
        run: dotnet test MLQT.Services.Tests -c Release --no-build --report-trx --report-trx-filename services-linux.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.McpServer tests
        if: '!cancelled()'
        run: dotnet test MLQT.McpServer.Tests -c Release --no-build --report-trx --report-trx-filename mcpserver-linux.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.Cli tests
        if: '!cancelled()'
        run: dotnet test MLQT.Cli.Tests -c Release --no-build --report-trx --report-trx-filename cli-linux.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Run MLQT.Shared tests
        if: '!cancelled()'
        run: dotnet test MLQT.Shared.Tests -c Release --no-build --report-trx --report-trx-filename shared-linux.trx --results-directory ${{ github.workspace }}/TestResults

      # Produce and run the exact artifact the release ships, against the committed fixture, so a
      # release cannot be the first time that binary is built or executed on Linux. The check's exit
      # code depends on the fixture's severities and is not what this asserts - that a report came
      # out is.
      - name: Publish and smoke-test the self-contained linux-x64 CLI
        if: '!cancelled()'
        run: |
          dotnet publish MLQT.Cli/MLQT.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o publish/mlqt-linux-x64
          chmod +x publish/mlqt-linux-x64/mlqt
          ./publish/mlqt-linux-x64/mlqt --version
          ./publish/mlqt-linux-x64/mlqt check TestFixtures/SarifSmoke/Libraries/Smoke --format json --out smoke.json || true
          test -s smoke.json

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-linux
          path: ${{ github.workspace }}/TestResults/*.trx

  ui-journeys:
    # The browser journeys, on both platforms. They were Linux-only, which left the only end-to-end
    # coverage of the shared UI never running on the platform the product currently ships on - and
    # the journeys are what catch a component that renders the wrong thing, which no unit test does.
    #
    # A matrix rather than two jobs: one definition, so a step added for one platform cannot be
    # forgotten for the other. fail-fast is off because "it broke on Linux only" and "it broke on
    # both" are different findings and the second leg is the one that says which.
    #
    # Deliberately does NOT install the MAUI workload on either leg. If this job ever needs it,
    # something non-portable has reached a project that is supposed to be portable, and that is the
    # finding.
    name: UI Journeys (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build the test host and journeys
        run: dotnet build MLQT.Journeys/MLQT.Journeys.csproj -c Release

      # --with-deps pulls the shared libraries a headless browser needs, which a bare Linux runner
      # does not have; without it the launch fails with a missing .so rather than a test failure. It
      # is an apt-get under the covers and has nothing to do on Windows, where the browser download
      # is the whole job.
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: pwsh MLQT.Journeys/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: pwsh MLQT.Journeys/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run the journeys
        run: dotnet test MLQT.Journeys -c Release --no-build --report-trx --report-trx-filename journeys-${{ matrix.label }}.trx --results-directory ${{ github.workspace }}/TestResults

      - name: Upload journey results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: journey-results-${{ matrix.label }}
          path: ${{ github.workspace }}/TestResults/*.trx

  build-maui:
    name: Build MAUI App (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Restore dependencies
        run: dotnet restore MLQT/MLQT.csproj -r win-x64

      - name: Build MAUI app
        run: dotnet build MLQT/MLQT.csproj -c Release -r win-x64 --no-restore


  code-coverage:
    name: Code Coverage
    runs-on: windows-latest
    needs: build-libraries

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      # Every suite that contributes coverage, not the three this job used to build. MLQT.Cli,
      # RevisionControl and MLQT.McpServer were measured nowhere, so the per-class bar CLAUDE.md sets
      # was unverified for exactly the code the CI/CD work added.
      #
      # This list must match $suites in build/check-coverage.ps1, which runs them with --no-build - a
      # suite missing here does not get measured, it fails the whole job with "expected N reports,
      # found N-1". MLQT.Shared.Tests was missing for exactly that reason after 7a-5 added it to the
      # ratchet, and the job never ran to say so because the jobs it depends on had already failed.
      # CoverageSuitesTests holds the two lists together.
      - name: Restore and build
        run: |
          dotnet restore MLQT.slnx
          dotnet build ModelicaParser.Tests -c Release --no-restore
          dotnet build ModelicaGraph.Tests -c Release --no-restore
          dotnet build MLQT.Services.Tests -c Release --no-restore
          dotnet build MLQT.Cli.Tests -c Release --no-restore
          dotnet build MLQT.McpServer.Tests -c Release --no-restore
          dotnet build MLQT.Shared.Tests -c Release --no-restore
          dotnet build RevisionControl.Tests -c Release --no-restore

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # Runs the suites, merges the six reports, and fails when a class drops below what
      # build/coverage-baseline.json records - see the script header for why it is a ratchet rather
      # than a flat threshold.
      - name: Run tests with coverage and gate on it
        run: pwsh -File build/check-coverage.ps1

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: CoverageReport/

  # The release ships a self-contained linux-x64 `mlqt`, and the tool package it also ships is
  # framework-dependent, so both run on Linux. Nothing here ever tested that: every other job is
  # windows-latest, so "the CLI works on Linux" was a claim held up by one person trying it once.
